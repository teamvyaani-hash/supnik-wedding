/* =========================================================

========================================================= */

function shuffleArray(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] =
    [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}

/* =========================================================
   SMOOTH INTERNAL LINKS
========================================================= */

document
  .querySelectorAll(
    'a[href^="#"]'
  )
  .forEach(
    link => {

      link.addEventListener(
        "click",
        event => {

          const targetId =
            link.getAttribute(
              "href"
            );


          if (
            !targetId ||
            targetId === "#"
          ) {
            return;
          }


          const target =
            document.querySelector(
              targetId
            );


          if (!target) {
            return;
          }


          event.preventDefault();


          target.scrollIntoView({
            behavior:
              "smooth",

            block:
              "start"
          });

        }
      );

    }
  );


/* =========================================================
   REVEALS
========================================================= */

const reveals =
  document.querySelectorAll(
    ".reveal"
  );


if (
  "IntersectionObserver"
  in window
) {

  const revealObserver =
    new IntersectionObserver(
      (
        entries,
        observer
      ) => {

        entries.forEach(
          entry => {

            if (
              !entry.isIntersecting
            ) {
              return;
            }


            entry.target
              .classList
              .add(
                "visible"
              );


            observer.unobserve(
              entry.target
            );

          }
        );

      },
      {
        threshold: 0.11,

        rootMargin:
          "0px 0px -30px 0px"
      }
    );


  reveals.forEach(
    element => {

      revealObserver.observe(
        element
      );

    }
  );

} else {

  reveals.forEach(
    element => {

      element.classList.add(
        "visible"
      );

    }
  );

}

/* =========================================================
   ACTIVE NAV
========================================================= */

function updateNavigation() {

  const position =
    window.scrollY +
    window.innerHeight *
    0.43;


  let active =
    "languages";


  navSections.forEach(
    section => {

      if (
        position >=
        section.element.offsetTop
      ) {

        active =
          section.id;

      }

    }
  );


  navLinks.forEach(
    link => {

      link.classList.toggle(
        "active",

        link.dataset.nav ===
          active
      );

    }
  );

}


window.addEventListener(
  "scroll",
  updateNavigation,
  {
    passive: true
  }
);
