
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reception Wall Admin</title>

<style>
:root {
  --bg:#211b20;
  --panel:#352833;
  --gold:#e4b78c;
  --cream:#fff5e9;
  --muted:#cbb8c2;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--cream);
  font-family:system-ui,sans-serif;
}
main {
  width:min(94%,850px);
  margin:35px auto;
}
h1 {font-family:Georgia,serif}
.panel {
  background:var(--panel);
  padding:22px;
  border-radius:15px;
  margin:15px 0;
}
input {
  width:100%;
  padding:14px;
  background:var(--bg);
  color:white;
  border:1px solid #66515f;
  border-radius:10px;
}
button {
  border:0;
  border-radius:9px;
  padding:12px 16px;
  margin:8px 8px 0 0;
  background:var(--gold);
  color:var(--bg);
  font-weight:700;
  cursor:pointer;
}
button:disabled {opacity:.5}
.reject {background:#d9a6a6}
.muted {
  color:var(--muted);
  font-size:13px;
}
.message {
  line-height:1.8;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.status {color:var(--gold);font-size:13px}
</style>
</head>

<body>
<main>
<h1>Reception Wall · Admin</h1>

<p class="muted">
  Review guest messages before they appear publicly.
</p>

<section class="panel">
  <label for="password">Admin password</label>
  <input
    id="password"
    type="password"
    autocomplete="off"
    placeholder="Enter moderation password"
  >
  <button id="load">LOAD MESSAGES</button>
  <p class="status" id="status" role="status"></p>
</section>

<section id="messages"></section>
</main>

<script>
(() => {
  const API = "/api/reception-wall";
  const $ = id => document.getElementById(id);

  let password = "";

  async function request(data) {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ...data,
        password
      })
    });

    const raw = await response.text();
    let result;

    try {
      result = JSON.parse(raw);
    } catch {
      throw new Error("Invalid server response.");
    }

    if (!response.ok) {
      throw new Error(result.error || "Request failed.");
    }

    return result;
  }

  async function load() {
    $("status").textContent = "Loading...";

    try {
      const result = await request({
        action: "admin-list"
      });

      const container = $("messages");
      container.replaceChildren();

      const pending = result.messages.filter(
        item => item.status === "pending"
      );

      const others = result.messages.filter(
        item => item.status !== "pending"
      );

      const sorted = [...pending, ...others];

      if (!sorted.length) {
        $("status").textContent = "No messages yet.";
        return;
      }

      sorted.forEach(item => {
        const card = document.createElement("article");
        card.className = "panel";

        const heading = document.createElement("h3");
        heading.textContent = item.name;

        const details = document.createElement("p");
        details.className = "muted";
        details.textContent =
          `${item.category} · ${item.status} · ${item.createdAt}`;

        const message = document.createElement("p");
        message.className = "message";
        message.textContent = item.message;

        card.append(heading, details, message);

        const approve = document.createElement("button");
        approve.textContent = "APPROVE";

        const reject = document.createElement("button");
        reject.textContent = "REJECT";
        reject.className = "reject";

        approve.disabled = item.status === "approved";
        reject.disabled = item.status === "rejected";

        async function moderate(decision) {
          approve.disabled = true;
          reject.disabled = true;

          try {
            await request({
              action: "moderate",
              id: item.id,
              decision
            });

            await load();
          } catch (error) {
            $("status").textContent = error.message;
            approve.disabled = false;
            reject.disabled = false;
          }
        }

        approve.addEventListener("click", () => {
          moderate("approve");
        });

        reject.addEventListener("click", () => {
          moderate("reject");
        });

        card.append(approve, reject);
        container.append(card);
      });

      $("status").textContent =
        `${pending.length} pending message(s).`;
    } catch (error) {
      $("status").textContent = error.message;
    }
  }

  $("load").addEventListener("click", () => {
    password = $("password").value;
    load();
  });
})();
</script>
</body>
</html>
